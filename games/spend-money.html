<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Потрать деньги миллиардера | Креативная Песочница</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --money-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding-bottom: 40px;
        }

        /* Кнопка Назад */
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background-color: var(--card-bg);
            color: #f3f4f6;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
            z-index: 100;
        }

        .back-button:hover {
            border-color: #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        header {
            text-align: center;
            padding: 40px 20px;
            margin-top: 50px;
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        /* Огромное табло с деньгами (прилипает к верху при скролле) */
        .money-bar {
            position: sticky;
            top: 0;
            background: linear-gradient(180deg, #16a34a, #22c55e);
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 2.5rem;
            font-weight: 800;
            z-index: 90;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            transition: background 0.3s;
        }

        /* Сетка товаров */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .item-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-emoji {
            font-size: 4rem;
            margin-bottom: 10px;
            user-select: none;
        }

        .item-name {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .item-price {
            color: var(--money-color);
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        /* Кнопки управления покупками */
        .item-controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            align-items: center;
        }

        .btn {
            border: none;
            padding: 10px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-sell {
            background-color: #ef4444;
            color: white;
        }
        .btn-sell:disabled {
            background-color: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .btn-buy {
            background-color: #22c55e;
            color: white;
        }
        .btn-buy:disabled {
            background-color: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .item-count {
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
        }

        /* Мобильная адаптация */
        @media (max-width: 480px) {
            header h1 { font-size: 1.5rem; }
            .money-bar { font-size: 1.8rem; padding: 15px; }
            .shop-grid { grid-template-columns: 1fr; gap: 15px; }
        }
    </style>
</head>
<body>

    <a href="../index.html" class="back-button">← Главная</a>

    <header>
        <h1>Потрать деньги миллиардера</h1>
        <p style="color: #94a3b8;">У вас неприлично много денег. Сможете потратить всё?</p>
    </header>

    <!-- Закрепленный баланс -->
    <div class="money-bar" id="moneyDisplay">$100,000,000,000</div>

    <!-- Магазин -->
    <div class="shop-grid" id="shopGrid"></div>

    <script>
        // Стартовый баланс: 100 миллиардов долларов
        let currentMoney = 100000000000;

        // База данных товаров
        const products = [
            { id: 0, name: "Сочный Бургер", price: 5, emoji: "🍔", count: 0 },
            { id: 1, name: "Билет в кино", price: 15, emoji: "🍿", count: 0 },
            { id: 2, name: "Игровая приставка", price: 500, emoji: "🎮", count: 0 },
            { id: 3, name: "Смартфон флагман", price: 1000, emoji: "📱", count: 0 },
            { id: 4, name: "Бриллиантовое кольцо", price: 10000, emoji: "💍", count: 0 },
            { id: 5, name: "Роскошные часы", price: 25000, emoji: "⌚", count: 0 },
            { id: 6, name: "Спортивный суперкар", price: 250000, emoji: "🏎️", count: 0 },
            { id: 7, name: "Частный вертолет", price: 2000000, emoji: "🚁", count: 0 },
            { id: 8, name: "Особняк в Беверли-Хиллз", price: 25000000, emoji: "🏰", count: 0 },
            { id: 9, name: "Пассажирский Боинг", price: 150000000, emoji: "🛩️", count: 0 },
            { id: 10, name: "Тропический остров", price: 1000000000, emoji: "🏝️", count: 0 },
            { id: 11, name: "Космическая ракета", price: 5000000000, emoji: "🚀", count: 0 }
        ];

        const moneyDisplay = document.getElementById('moneyDisplay');
        const shopGrid = document.getElementById('shopGrid');

        // Функция красивого форматирования денег (добавляет запятые)
        function formatMoney(amount) {
            return '$' + amount.toLocaleString('en-US');
        }

        // Генерация карточек товаров в HTML
        function renderShop() {
            shopGrid.innerHTML = '';
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'item-card';
                
                // Проверяем, доступны ли кнопки
                const canBuy = currentMoney >= product.price;
                const canSell = product.count > 0;

                card.innerHTML = `
                    <div class="item-emoji">${product.emoji}</div>
                    <div>
                        <div class="item-name">${product.name}</div>
                        <div class="item-price">${formatMoney(product.price)}</div>
                    </div>
                    <div class="item-controls">
                        <button class="btn btn-sell" ${canSell ? '' : 'disabled'} onclick="sellItem(${product.id})">Продать</button>
                        <span class="item-count">${product.count}</span>
                        <button class="btn btn-buy" ${canBuy ? '' : 'disabled'} onclick="buyItem(${product.id})">Купить</button>
                    </div>
                `;
                shopGrid.appendChild(card);
            });
            
            // Обновляем верхнее табло
            moneyDisplay.textContent = formatMoney(currentMoney);
            
            // Если деньги кончились, делаем фон табло серым
            if (currentMoney === 0) {
                moneyDisplay.style.background = '#475569';
                moneyDisplay.textContent = "Вы умудрились потратить ВСЁ!";
            } else {
                moneyDisplay.style.background = 'linear-gradient(180deg, #16a34a, #22c55e)';
            }
        }

        // Логика покупки
        window.buyItem = function(id) {
            const product = products.find(p => p.id === id);
            if (currentMoney >= product.price) {
                currentMoney -= product.price;
                product.count++;
                renderShop();
            }
        };

        // Логика продажи
        window.sellItem = function(id) {
            const product = products.find(p => p.id === id);
            if (product.count > 0) {
                currentMoney += product.price;
                product.count--;
                renderShop();
            }
        };

        // Старт игры
        renderShop();
    </script>
</body>
</html>
