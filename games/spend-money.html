<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Потрать деньги миллиардера | PNG Версия</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --money-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding-bottom: 40px;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background-color: var(--card-bg);
            color: #f3f4f6;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
            z-index: 100;
        }

        .back-button:hover {
            border-color: #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        header {
            text-align: center;
            padding: 40px 20px;
            margin-top: 50px;
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .money-bar {
            position: sticky;
            top: 0;
            background: linear-gradient(180deg, #16a34a, #22c55e);
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 2.5rem;
            font-weight: 800;
            z-index: 90;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .item-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* Стиль для контейнера картинок */
        .item-image-container {
            width: 100%;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            overflow: hidden;
        }

        /* Стиль для самих PNG-картинок */
        .item-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Картинка сохраняет пропорции и не сжимается криво */
            user-select: none;
            -webkit-user-drag: none;
        }

        .item-name {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .item-price {
            color: var(--money-color);
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .item-controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            align-items: center;
            width: 100%;
        }

        .btn {
            border: none;
            padding: 10px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-sell { background-color: #ef4444; color: white; }
        .btn-sell:disabled { background-color: #475569; color: #94a3b8; cursor: not-allowed; }

        .btn-buy { background-color: #22c55e; color: white; }
        .btn-buy:disabled { background-color: #475569; color: #94a3b8; cursor: not-allowed; }

        .item-count {
            font-size: 1.2rem;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            header h1 { font-size: 1.5rem; }
            .money-bar { font-size: 1.8rem; padding: 15px; }
            .shop-grid { grid-template-columns: 1fr; gap: 15px; }
            .item-image-container { height: 110px; }
        }
    </style>
</head>
<body>

    <a href="../index.html" class="back-button">← Главная</a>

    <header>
        <h1>Потрать деньги миллиардера</h1>
        <p style="color: #94a3b8;">У вас неприлично много денег. Сможете потратить всё?</p>
    </header>

    <div class="money-bar" id="moneyDisplay">$100,000,000,000</div>

    <div class="shop-grid" id="shopGrid"></div>

    <script>
        let currentMoney = 100000000000;

        // База данных товаров с PNG картинками из открытых источников
        const products = [
            { id: 0, name: "Сочный Бургер", price: 5, img: "../png/burger.png", count: 0 },
            { id: 1, name: "Игровая приставка", price: 500, img: "https://icons8.com", count: 0 },
            { id: 2, name: "Смартфон флагман", price: 1000, img: "https://icons8.com", count: 0 },
            { id: 3, name: "Бриллиантовое кольцо", price: 10000, img: "https://icons8.com", count: 0 },
            { id: 4, name: "Пикап", price: 250000, img: "../png/picap.png", count: 0 },
            { id: 5, name: "Спортивный суперкар", price: 250000, img: "https://icons8.com", count: 0 },
            { id: 6, name: "Частный вертолет", price: 2000000, img: "https://icons8.com", count: 0 },
            { id: 7, name: "Особняк", price: 25000000, img: "https://icons8.com", count: 0 },
            { id: 8, name: "Тропический остров", price: 1000000000, img: "https://icons8.com", count: 0 }
        ];

        const moneyDisplay = document.getElementById('moneyDisplay');
        const shopGrid = document.getElementById('shopGrid');

        function formatMoney(amount) {
            return '$' + amount.toLocaleString('en-US');
        }

        function renderShop() {
            shopGrid.innerHTML = '';
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'item-card';
                
                const canBuy = currentMoney >= product.price;
                const canSell = product.count > 0;

                card.innerHTML = `
                    <div class="item-image-container">
                        <img src="${product.img}" alt="${product.name}" class="item-image">
                    </div>
                    <div style="width: 100%">
                        <div class="item-name">${product.name}</div>
                        <div class="item-price">${formatMoney(product.price)}</div>
                    </div>
                    <div class="item-controls">
                        <button class="btn btn-sell" ${canSell ? '' : 'disabled'} onclick="sellItem(${product.id})">Продать</button>
                        <span class="item-count">${product.count}</span>
                        <button class="btn btn-buy" ${canBuy ? '' : 'disabled'} onclick="buyItem(${product.id})">Купить</button>
                    </div>
                `;
                shopGrid.appendChild(card);
            });
            
            moneyDisplay.textContent = formatMoney(currentMoney);
            
            if (currentMoney === 0) {
                moneyDisplay.style.background = '#475569';
                moneyDisplay.textContent = "Вы умудрились потратить ВСЁ!";
            } else {
                moneyDisplay.style.background = 'linear-gradient(180deg, #16a34a, #22c55e)';
            }
        }

        window.buyItem = function(id) {
            const product = products.find(p => p.id === id);
            if (currentMoney >= product.price) {
                currentMoney -= product.price;
                product.count++;
                renderShop();
            }
        };

        window.sellItem = function(id) {
            const product = products.find(p => p.id === id);
            if (product.count > 0) {
                currentMoney += product.price;
                product.count--;
                renderShop();
            }
        };

        renderShop();
    </script>
</body>
</html>
